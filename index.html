<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
        }
        #time {
            font-size: 24px;
            color: green;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>🟢 Application is Online</h1>
    <p>This page refreshes the current time every second.</p>

    <div id="time"></div>

    <script>
        function updateTime() {
            document.getElementById("time").textContent =
                "Current Time: " + new Date().toLocaleTimeString();
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
